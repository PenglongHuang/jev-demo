<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>灵犀邮箱 · 收件箱</title>
<!-- 企业外壳：模块 rail / KPI 条 / 通知中心 / 抽屉 / 状态栏 / 实时模拟开关。
     本页原有的样式与结构保持不动，外壳只做加法。 -->
<link rel="stylesheet" href="enterprise.css" />
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --border: #e7e8ec; --border-strong: #d7d9e0;
    --text: #1a1c20; --text-2: #565c66; --text-3: #6e7480;
    --accent: #4f46e5; --accent-soft: #eef2ff; --green: #0d9268; --green-soft: #e7f6f0;
    --red: #dc2626; --red-soft: #fdecec; --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --ent-maxw: 1180px;          /* 让 KPI 条 / 公告条与主容器同宽 */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,.9); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border); padding: 10px 22px;
  }
  .brand { font-weight: 700; font-size: 15.5px; color: var(--accent); white-space: nowrap; }
  .topbar input[type="search"] {
    flex: 1; max-width: 420px; padding: 8px 12px; font-size: 13.5px; font-family: inherit;
    border: 1px solid var(--border-strong); border-radius: 9px; outline: none; background: #fbfbfc;
  }
  .topbar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn {
    padding: 7px 14px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
    border-radius: 9px; border: 1px solid var(--border-strong); background: #fff; color: var(--text-2);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn:disabled:hover { border-color: var(--border-strong); color: var(--text-2); }
  .layout { display: grid; grid-template-columns: 190px 1fr; gap: 18px; max-width: var(--ent-maxw); margin: 16px auto; padding: 0 22px; }
  .folders { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; height: fit-content; }
  .folders ul { list-style: none; margin: 0; padding: 0; }
  .folders button {
    display: flex; justify-content: space-between; width: 100%; padding: 8px 11px; font-size: 13.5px;
    background: none; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; color: var(--text-2);
  }
  .folders button:hover { background: #f2f3f6; color: var(--text); }
  .folders button.active { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
  .folders .count { font-size: 11.5px; color: var(--text-3); font-family: var(--mono); }
  .folder-note { font-size: 11.5px; color: var(--text-3); padding: 8px 11px 2px; }
  .side-block { border-top: 1px solid var(--border); margin-top: 8px; padding: 10px 11px 2px; }
  .side-block h2 { font-size: 11.5px; font-weight: 700; color: var(--text-3); margin: 0 0 7px; letter-spacing: .3px; }
  .side-block .bar { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); margin-bottom: 5px; }
  .side-block .bar .dot { width: 7px; height: 7px; border-radius: 100px; flex: none; }
  .side-block .bar .n { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }

  .list-panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .list-head {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 13px 18px; border-bottom: 1px solid var(--border);
  }
  .list-head h1 { font-size: 16px; margin: 0; }
  .list-head .meta { font-size: 12px; color: var(--text-3); font-family: var(--mono); }
  .list-head .spacer { flex: 1; }

  /* 二次筛选工具条 */
  .ent-toolbar {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    padding: 10px 18px; border-bottom: 1px solid var(--border); background: #fbfbfd;
  }
  .ent-toolbar .ent-chips-lbl { font-size: 12.5px; color: var(--text-3); }
  .ent-toolbar select {
    padding: 6px 9px; font-size: 12.5px; font-family: inherit; color: var(--text-2);
    border: 1px solid var(--border-strong); border-radius: 8px; background: #fff; outline: none;
  }
  .ent-toolbar select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .ent-toolbar .ent-check { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); }
  .ent-toolbar .ent-check input { accent-color: var(--accent); }
  .ent-toolbar .spacer { flex: 1; }
  .ent-toolbar .meta { font-size: 12px; color: var(--text-3); font-family: var(--mono); }

  .mail-list { list-style: none; margin: 0; padding: 0; }
  .mail {
    display: grid; grid-template-columns: 22px 30px 22px 148px 1fr 62px;
    gap: 9px; align-items: start; padding: 11px 18px; border-bottom: 1px solid var(--border);
  }
  .mail:last-child { border-bottom: none; }
  .mail:hover { background: #fafbfd; }
  .mail.unread .from, .mail.unread .subj { font-weight: 700; }
  .mail input[type="checkbox"] { accent-color: var(--accent); margin-top: 3px; }
  .mail .ent-avatar.sm { width: 28px; height: 28px; font-size: 12px; }
  .star { background: none; border: none; cursor: pointer; font-size: 15px; color: #cbd0da; padding: 0; }
  .star.on { color: #f0a132; }
  .from { color: var(--text); font-size: 13px; background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; text-align: left; }
  .from:hover { color: var(--accent); }
  .mid { min-width: 0; }
  .subj { background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; font-size: 13.5px; color: var(--text); text-align: left; }
  .subj:hover { color: var(--accent); }
  .snippet { margin: 2px 0 0; font-size: 12.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
  .ops { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .ops button {
    font-size: 12px; padding: 3.5px 10px; border-radius: 100px; cursor: pointer; font-family: inherit;
    border: 1px solid var(--border-strong); background: #fff; color: var(--text-2);
  }
  .ops button:hover { border-color: var(--accent); color: var(--accent); }
  .ops button.danger:hover { border-color: var(--red); color: var(--red); }
  .time { font-size: 11.5px; color: var(--text-3); font-family: var(--mono); text-align: right; padding-top: 2px; }
  .att { font-size: 11px; color: var(--text-3); }
  .empty { padding: 56px 20px; text-align: center; color: var(--text-3); font-size: 13px; }
  .pager {
    display: flex; align-items: center; justify-content: center; gap: 16px;
    padding: 12px 18px; border-top: 1px solid var(--border);
  }
  .toast {
    position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%) translateY(14px);
    background: #17181c; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: .22s; z-index: 99; max-width: 86vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  dialog {
    border: none; border-radius: 14px; padding: 0; width: min(520px, 92vw);
    box-shadow: 0 18px 50px rgba(16,18,24,.18);
  }
  dialog::backdrop { background: rgba(20,22,28,.42); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid var(--border); font-weight: 700; }
  .dlg-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .dlg-body label { font-size: 12.5px; font-weight: 600; color: var(--text-2); display: block; margin-bottom: 4px; }
  .dlg-body input, .dlg-body textarea {
    width: 100%; padding: 8px 11px; font-size: 13.5px; font-family: inherit;
    border: 1px solid var(--border-strong); border-radius: 9px;
  }
  .dlg-body textarea { min-height: 110px; resize: vertical; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 13px 20px; border-top: 1px solid var(--border); }
  .thread { list-style: none; margin: 0; padding: 0; }
  .thread li { border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; margin-bottom: 9px; }
  .thread .th-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-3); }
  .thread .th-head b { color: var(--text); font-size: 13px; }
  .thread .th-body { font-size: 13px; color: var(--text-2); margin: 7px 0 0; line-height: 1.7; }
  .attach-list { list-style: none; margin: 0; padding: 0; }
  .attach-list li {
    display: flex; align-items: center; gap: 9px; padding: 8px 11px;
    border: 1px solid var(--border); border-radius: 9px; margin-bottom: 7px; font-size: 12.5px;
  }
  .attach-list .sz { margin-left: auto; font-family: var(--mono); color: var(--text-3); font-size: 11.5px; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .mail { grid-template-columns: 22px 30px 22px 1fr 62px; }
    .mid { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<header class="topbar">
  <span class="brand">◇ 灵犀邮箱</span>
  <input id="searchBox" type="search" aria-label="搜索邮件" placeholder="搜索邮件（按发件人或主题过滤）" />
  <button class="btn primary" id="composeBtn" type="button">写信</button>
  <button class="btn" id="resetBtn" type="button">重置演示</button>
</header>

<!-- KPI 条 + 系统公告（由 Enterprise.mountShell 填充） -->
<div class="ent-kpis" id="entKpis"></div>
<div id="entTickerHost"></div>

<div class="layout">
  <nav class="folders" aria-label="文件夹">
    <ul id="folderList"></ul>
    <p class="folder-note">已归档 <b id="archivedCount">0</b> 封<br />已删除 <b id="deletedCount">0</b> 封</p>
    <div class="side-block">
      <h2>邮箱容量</h2>
      <div class="bar"><span class="dot" style="background:#4f46e5"></span>已用<span class="n" id="quotaUsed">1.2 GB / 5 GB</span></div>
      <div class="bar"><span class="dot" style="background:#0d9268"></span>附件占比<span class="n" id="quotaAtt">38%</span></div>
      <div class="bar"><span class="dot" style="background:#f59e0b"></span>待清理<span class="n" id="quotaJunk">12 封</span></div>
    </div>
    <div class="side-block">
      <h2>快捷规则</h2>
      <div class="bar"><span class="dot" style="background:#4f46e5"></span>账单自动归档<span class="n">已启用</span></div>
      <div class="bar"><span class="dot" style="background:#0d9268"></span>营销邮件降级<span class="n">已启用</span></div>
      <div class="bar"><span class="dot" style="background:#6e7480"></span>外部发件人提醒<span class="n">已启用</span></div>
    </div>
  </nav>

  <main class="list-panel">
    <div class="list-head">
      <h1 id="folderTitle">收件箱</h1>
      <span class="meta" id="listMeta"></span>
      <span class="spacer"></span>
      <span class="meta">按时间倒序 · 归档与删除均记录操作审计</span>
    </div>

    <div class="ent-toolbar">
      <label class="ent-check"><input type="checkbox" id="selectAll" aria-label="全选本页邮件" />全选本页邮件</label>
      <button class="btn" id="refreshBtn" type="button" style="padding:5px 12px;font-size:12.5px">刷新</button>
      <select id="filterSel" aria-label="筛选">
        <option>全部邮件</option>
        <option>未读</option>
        <option>带附件</option>
        <option>已标星</option>
      </select>
      <select id="sortSel" aria-label="排序">
        <option>时间倒序</option>
        <option>时间正序</option>
        <option>按发件人</option>
        <option>按主题</option>
      </select>
      <button class="btn" id="clearFilterBtn" type="button" style="padding:5px 12px;font-size:12.5px">清除筛选</button>
      <span class="spacer"></span>
      <span class="meta" id="filterHint">未使用任何筛选</span>
    </div>

    <div id="bulkHost"></div>

    <div id="listHost">
      <ul class="mail-list" id="mailList"></ul>
      <div class="empty" id="emptyState" hidden>这里没有邮件</div>
    </div>

    <nav class="pager" aria-label="分页">
      <button class="btn" id="prevPage" type="button" disabled>上一页</button>
      <span class="meta" id="pageMeta">第 1 / 5 页 · 共 86 封，未读 23 封</span>
      <button class="btn" id="nextPage" type="button">下一页</button>
    </nav>
  </main>
</div>

<dialog id="composeDlg" aria-labelledby="composeTitle">
  <form method="dialog" style="margin:0">
    <div class="dlg-head"><span id="composeTitle">写信</span><button class="btn" type="submit" value="cancel" formnovalidate>关闭</button></div>
    <div class="dlg-body">
      <div><label for="toInput">收件人</label><input id="toInput" aria-label="收件人邮箱" placeholder="name@example.com" /></div>
      <div><label for="subjInput">主题</label><input id="subjInput" aria-label="邮件主题" placeholder="邮件主题" /></div>
      <div><label for="bodyInput">正文</label><textarea id="bodyInput" aria-label="邮件正文" placeholder="写点什么…"></textarea></div>
    </div>
    <div class="dlg-foot">
      <button class="btn" type="submit" value="cancel" formnovalidate>取消</button>
      <button class="btn primary" type="submit" value="send" id="sendBtn">发送</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="enterprise.js"></script>
<script>

 * 干扰项：同一发件人另有 8 月对账单与还款通知；招商银行储蓄卡 2 封；兴业银行账单
 * 主题相近；每行一个同名「归档」按钮。
 *
 * ⚠️ 改这个页面时最容易踩的三条（都有测试钉着，见 tests/scenario-walk.spec.js）：
 *   1. 行标签必须保持 `邮件 N：发件人 · 主题`（N = **当前过滤结果**里的序号，从 1 起）。
 *   2. 星标按钮必须是「发件人按钮前面紧邻的那一个 ref」—— 任何元素插到它俩中间
 *      都会让走查用例找不到星标。
 *   3. 归档 / 删除 / 标为未读 三个按钮在同一行内必须保持这个先后顺序，且**批量**按钮
 *      一律叫「批量归档 / 批量删除 / 标记为已读」——叫「归档」会把列表首个同名按钮

 *   4. 新增的可访问名里不要出现「冒号+空格」：YAML 会给整行加引号，行首锚定的正则

 */

const state = {
  folder: 'inbox', mails: [], archived: 0, deleted: 0, query: '',
  filter: '全部邮件', sort: '时间倒序', selected: [], arrivals: 0,
};

let uid = 0;
const $ = (id) => document.getElementById(id);

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- 初始化 / 重置 ---------- */
function reset() {
  state.mails = MAILS.map((m, i) => Object.assign({ unread: i < 3, id: ++uid }, m));
  state.archived = 0; state.deleted = 0; state.folder = 'inbox'; state.query = '';
  state.filter = '全部邮件'; state.sort = '时间倒序'; state.selected = []; state.arrivals = 0;
  $('searchBox').value = '';
  $('filterSel').value = '全部邮件';
  $('sortSel').value = '时间倒序';
  $('selectAll').checked = false;
  render();
}

/* 抽屉开着时，重置要把它收掉，免得正文停在一封已经不存在的邮件上；
 * 同时必须把「实时模拟」关掉 —— 否则刚投递的新邮件会立刻破坏「初始 18 封」。 */
function hardReset() {
  Enterprise.drawer.close();
  const cb = document.querySelector('.ent-sim input');
  if (cb && cb.checked) {
    cb.checked = false;
    cb.dispatchEvent(new Event('change'));
  }
  reset();
}

/* ---------- 过滤 / 排序 ---------- */
function filtersActive() {
  return state.filter !== '全部邮件' || state.sort !== '时间倒序' || state.query.trim() !== '';
}

function visibleMails() {
  let list;
  if (state.folder === 'starred') {
    list = state.mails.filter((m) => m.star);
  } else if (state.folder !== 'inbox') {
    list = [];
  } else {
    list = state.mails.slice();
  }
  const q = state.query.trim().toLowerCase();
  if (q) {
    list = list.filter((m) => (m.from + ' ' + m.subject + ' ' + m.snippet).toLowerCase().includes(q));
  }
  if (state.filter === '未读') list = list.filter((m) => m.unread);
  else if (state.filter === '带附件') list = list.filter((m) => m.att);
  else if (state.filter === '已标星') list = list.filter((m) => m.star);

  if (state.sort === '时间正序') list = list.slice().reverse();
  else if (state.sort === '按发件人') list = list.slice().sort((a, b) => a.from.localeCompare(b.from, 'zh'));
  else if (state.sort === '按主题') list = list.slice().sort((a, b) => a.subject.localeCompare(b.subject, 'zh'));
  return list;
}

/* ---------- 选择态 ---------- */
function isSelected(id) { return state.selected.indexOf(id) !== -1; }
function toggleSelect(id) {
  state.selected = isSelected(id) ? state.selected.filter((x) => x !== id) : state.selected.concat([id]);
  render();
}
function selectedMails() {
  return state.mails.filter((m) => isSelected(m.id));
}

/* ---------- 批量操作条：只在有选中时**才存在** ----------
 * 不能常驻 + hidden：常驻会让列表首个「归档」判断被批量按钮抢走。 */
function renderBulk() {
  const host = $('bulkHost');
  host.innerHTML = '';
  const n = state.selected.length;
  if (!n) return;
  const bar = document.createElement('div');
  bar.className = 'ent-bulkbar';
  const lab = document.createElement('span');
  lab.appendChild(document.createTextNode('已选中 '));
  const b = document.createElement('b');
  b.className = 'ent-bulk-n';
  b.textContent = String(n);
  lab.appendChild(b);
  lab.appendChild(document.createTextNode(' 封邮件'));
  bar.appendChild(lab);
  const sp = document.createElement('span');
  sp.className = 'spacer';
  bar.appendChild(sp);

  const mk = (label, fn) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    btn.style.fontSize = '12.5px';
    btn.style.padding = '5px 12px';
    btn.textContent = label;
    btn.setAttribute('aria-label', label);
    btn.onclick = fn;
    return btn;
  };
  bar.appendChild(mk('批量归档', () => {
    const ids = state.selected.slice();
    state.mails = state.mails.filter((m) => ids.indexOf(m.id) === -1);
    state.archived += ids.length;
    state.selected = [];
    render();
    toast('已批量归档 ' + ids.length + ' 封邮件');
  }));
  bar.appendChild(mk('批量删除', () => {
    const ids = state.selected.slice();
    if (!window.confirm('确定要删除选中的 ' + ids.length + ' 封邮件吗？')) return;
    state.mails = state.mails.filter((m) => ids.indexOf(m.id) === -1);
    state.deleted += ids.length;
    state.selected = [];
    render();
    toast('已批量删除 ' + ids.length + ' 封邮件');
  }));
  bar.appendChild(mk('标记为已读', () => {
    const ids = state.selected.slice();
    state.mails = state.mails.map((m) => (ids.indexOf(m.id) === -1 ? m : Object.assign({}, m, { unread: false })));
    render();
    toast('已把 ' + ids.length + ' 封标记为已读');
  }));
  bar.appendChild(mk('取消选择', () => { state.selected = []; render(); }));
  host.appendChild(bar);
}

  kv('发件人', m.from);

  kv('时间', '2026-' + m.time);

  if (m.att) kv('附件', '已随邮件附上，共 1 个文件');

  const sec1 = document.createElement('section');

  const sec2 = document.createElement('section');

    const sz = document.createElement('span');
    sz.className = 'sz';
    sz.textContent = '248 KB';
    li.appendChild(sz);
    ul.appendChild(li);
    secA.appendChild(ul);
    const dl = document.createElement('button');
    dl.type = 'button';
    dl.className = 'btn';
    dl.style.fontSize = '12.5px';
    dl.textContent = '下载全部附件';
    dl.setAttribute('aria-label', '下载全部附件');

    head.appendChild(who);
    head.appendChild(document.createTextNode(' · 2026-09-' + String(19 + (i % 4)).padStart(2, '0') + ' 0' + (8 + i) + ':' + (10 + i * 7)));
    li.appendChild(head);
    const body = document.createElement('p');
    body.className = 'th-body';
    body.textContent = i === n - 1
      ? m.snippet
      : '（历史回复 ' + (i + 1) + '）已收到，我先同步给相关同学，有结论在这条线程里回你。';
    li.appendChild(body);
    ul.appendChild(li);

  sec3.appendChild(ul);

  const foot = document.createElement('div');

  arch.setAttribute('aria-label', '归档这封');
  arch.onclick = () => {
    Enterprise.drawer.close();
    state.mails = state.mails.filter((x) => x.id !== m.id);
    state.archived += 1;
    render();
    toast('已归档：' + m.subject);
  };
  foot.appendChild(arch);

  Enterprise.drawer.open({
    title: m.subject,
    sub: m.from + ' · 2026-' + m.time,

      { label: '邮件正文', render: () => sec2 },

/* ---------- 渲染 ---------- */
function render() {
  /* 文件夹导航 */
  const fl = $('folderList');
  fl.innerHTML = '';
  FOLDERS.forEach((f) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.className = state.folder === f.id ? 'active' : '';
    const label = f.id === 'inbox' ? f.name + ' (' + state.mails.length + ')' : f.name + (f.count ? ' (' + f.count + ')' : '');
    const name = document.createElement('span');
    name.textContent = label;
    b.appendChild(name);
    b.setAttribute('aria-label', label);
    b.onclick = () => { state.folder = f.id; state.selected = []; render(); };
    li.appendChild(b);
    fl.appendChild(li);
  });
  $('archivedCount').textContent = String(state.archived);
  $('deletedCount').textContent = String(state.deleted);
  $('quotaJunk').textContent = String(12 + state.arrivals) + ' 封';

  /* 列表 */
  const list = visibleMails();
  $('folderTitle').textContent = (FOLDERS.find((f) => f.id === state.folder) || {}).name || '';
  $('listMeta').textContent = state.folder === 'inbox'
    ? '共 ' + list.length + ' 封，未读 ' + state.mails.filter((m) => m.unread).length + ' 封'
    : '共 ' + list.length + ' 封';
  $('filterHint').textContent = filtersActive() ? '已启用筛选条件' : '未使用任何筛选';
  $('pageMeta').textContent = state.folder === 'inbox' && !filtersActive()
    ? '第 1 / 5 页 · 共 86 封，未读 23 封'
    : '第 1 / 1 页 · 共 ' + list.length + ' 封（已筛选）';
  $('selectAll').disabled = list.length === 0;

  const ul = $('mailList');
  ul.setAttribute('aria-label', '邮件列表（按时间倒序，共 ' + list.length + ' 封）');
  ul.innerHTML = '';
  $('emptyState').hidden = list.length > 0;
  if (!list.length) {
    $('emptyState').textContent = (state.folder === 'inbox' && state.query)
      ? '没有匹配「' + state.query + '」的邮件'
      : '这里没有邮件';
  }

  list.forEach((m, i) => {
    const li = document.createElement('li');
    li.className = 'mail' + (m.unread ? ' unread' : '') + (m.fresh ? ' ent-flash' : '');
    li.setAttribute('aria-label', '邮件 ' + (i + 1) + '：' + m.from + ' · ' + m.subject);

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = isSelected(m.id);
    cb.setAttribute('aria-label', '选择这封邮件');
    cb.onchange = () => toggleSelect(m.id);
    li.appendChild(cb);

    const av = document.createElement('span');
    av.className = 'ent-avatar sm';
    av.setAttribute('aria-hidden', 'true');
    av.textContent = m.from.slice(0, 1);
    li.appendChild(av);

    const star = document.createElement('button');
    star.type = 'button';
    star.className = 'star' + (m.star ? ' on' : '');
    star.textContent = m.star ? '★' : '☆';
    star.setAttribute('aria-label', m.star ? '已标星' : '未标星');
    star.title = m.star ? '取消星标' : '加星标';
    star.onclick = () => { m.star = !m.star; render(); toast(m.star ? '已标星：' + m.subject : '已取消星标'); };
    li.appendChild(star);

    const from = document.createElement('button');
    from.type = 'button';
    from.className = 'from';
    from.textContent = m.from;
    from.setAttribute('aria-label', m.from);
    from.title = '搜索该发件人';
    from.onclick = () => {
      state.folder = 'inbox'; state.query = m.from;
      $('searchBox').value = m.from;
      render();
    };
    li.appendChild(from);

    const mid = document.createElement('div');
    mid.className = 'mid';
    const subj = document.createElement('button');
    subj.type = 'button';
    subj.className = 'subj';
    subj.textContent = m.subject + (m.att ? '（附件）' : '');
    subj.setAttribute('aria-label', m.subject + (m.att ? '（附件）' : ''));
    subj.onclick = () => { m.unread = false; render(); toast('已读：' + m.subject); openReader(m); };
    mid.appendChild(subj);
    const sn = document.createElement('p');
    sn.className = 'snippet';
    sn.textContent = m.snippet;
    mid.appendChild(sn);

    const rm = document.createElement('div');
    rm.className = 'row-meta';
    const tag = document.createElement('span');
    tag.className = 'ent-tag' + (m.tag === '待办' ? ' warn' : (m.tag === '账单' ? ' info' : ''));
    tag.textContent = m.tag;
    rm.appendChild(tag);
    if (m.att) {
      const a = document.createElement('span');
      a.className = 'att';
      a.textContent = '📎 1 个附件';
      rm.appendChild(a);
    }
    if (m.thread > 1) {
      const t = document.createElement('span');
      t.className = 'att';
      t.textContent = '💬 ' + m.thread + ' 封会话';
      rm.appendChild(t);
    }
    if (m.arrivals) {
      const nw = document.createElement('span');
      nw.className = 'ent-new';
      nw.textContent = 'NEW';
      rm.appendChild(nw);
    }
    mid.appendChild(rm);

    const ops = document.createElement('div');
    ops.className = 'ops';
    const mk = (label, cls, fn) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = cls || '';
      b.textContent = label;
      b.setAttribute('aria-label', label);
      b.onclick = fn;
      return b;
    };
    ops.appendChild(mk('归档', '', () => {
      state.mails = state.mails.filter((x) => x.id !== m.id);
      state.selected = state.selected.filter((x) => x !== m.id);
      state.archived += 1;
      render();
      toast('已归档：' + m.subject);
    }));
    ops.appendChild(mk('删除', 'danger', () => {
      /* 原生 confirm：演示 dialog-accept / dialog-dismiss 动作 */
      if (window.confirm('确定要删除这封邮件吗？\n' + m.subject)) {
        state.mails = state.mails.filter((x) => x.id !== m.id);
        state.selected = state.selected.filter((x) => x !== m.id);
        state.deleted += 1;
        render();
        toast('已删除：' + m.subject);
      }
    }));
    ops.appendChild(mk('标为未读', '', () => { m.unread = true; render(); toast('已标为未读：' + m.subject); }));
    mid.appendChild(ops);
    li.appendChild(mid);

    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = m.time;
    li.appendChild(time);

    ul.appendChild(li);
  });

  renderBulk();
  /* 全选框：三态由当前可见列表决定 */
  const sel = list.filter((m) => isSelected(m.id)).length;
  $('selectAll').checked = list.length > 0 && sel === list.length;
  $('selectAll').indeterminate = sel > 0 && sel < list.length;
}

$('clearFilterBtn').onclick = () => {
  state.filter = '全部邮件'; state.sort = '时间倒序'; state.query = '';
  $('filterSel').value = '全部邮件'; $('sortSel').value = '时间倒序'; $('searchBox').value = '';
  render();
  toast('筛选条件已重置为「全部邮件」');
};
$('selectAll').addEventListener('change', (e) => {
  const list = visibleMails();
  state.selected = e.target.checked ? list.map((m) => m.id) : [];
  render();
});
$('refreshBtn').onclick = () => {
  /* 刷新走骨架屏：这是**用户触发**的动作，不会自己发生，因此不影响快照确定性 */
  const ul = $('mailList');
  ul.hidden = true;
  Enterprise.skeleton($('listHost'), 420, () => {
    ul.hidden = false;
    render();
    toast('已刷新收件箱（最近同步 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }) + '）');
  });
};
$('prevPage').disabled = true;
$('nextPage').onclick = () => toast('演示页仅提供第 1 页（共 86 封），翻页不可用');

    /* 实时模拟：逐封投递新邮件。这是**唯一**会自己改页面的机制，且必须由用户显式打开。 */
    sim.subscribe((step) => {
      if (step > INCOMING.length) {
        Enterprise.toast({ icon: '✔', title: '模拟已跑完固定脚本', meta: '共投递 ' + INCOMING.length + ' 封新邮件' });
        return;
      }
      /* 新的一封到达时，把上一封的「NEW」高亮摘掉 —— 用状态做，不另起定时器：
       * render() 会重建整行，留在行上的 .ent-flash 会跟着重播。 */
      state.mails = state.mails.map((m) => (m.fresh ? Object.assign({}, m, { fresh: false }) : m));
      const mail = Object.assign({ unread: true, id: ++uid, fresh: true, arrivals: step }, INCOMING[step - 1]);
      state.mails = [mail].concat(state.mails);
      state.arrivals = step;
      if (state.folder === 'inbox') render();
      Enterprise.bumpKpi($('entKpis'), '今日新邮件', 1);
      Enterprise.bumpKpi($('entKpis'), '未读邮件', 1);
      Enterprise.toast({ icon: '📥', title: '新邮件 · ' + mail.from, meta: mail.subject });
    });
  },
});
