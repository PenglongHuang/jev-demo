<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>云上书城订单中台 · 复杂任务台</title>
<!-- 企业外壳：模块 rail / KPI 条 / 通知中心 / 抽屉 / 状态栏 / 公告跑马灯 / 实时模拟开关。
     与 orders.html（简单版）共用同一套外壳，本页只在“表格 + 筛选”上做重度加码：
     列更多、字段更多、筛选控件更多样（多选 chips / 快捷区间 / 高级筛选折叠 / 排序与分页 /
     保存的视图 / 卡片视图 / 行内展开）。 -->
<link rel="stylesheet" href="enterprise.css" />
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --border: #e7e8ec; --border-strong: #d7d9e0;
    --text: #1a1c20; --text-2: #565c66; --text-3: #6e7480;
    --accent: #4f46e5; --accent-soft: #eef2ff; --green: #0d9268; --green-soft: #e7f6f0;
    --red: #dc2626; --red-soft: #fdecec; --amber: #92400e; --amber-soft: #fef3c7;
    --violet: #6d28d9; --violet-soft: #f3e8ff;
    --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --ent-maxw: 1680px;          /* 让 KPI 条 / 公告条与主容器同宽 */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 12px; flex-wrap: nowrap;
    background: rgba(255,255,255,.9); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border); padding: 8px 22px;
  }
  .brand { font-weight: 700; font-size: 15px; color: var(--accent); white-space: nowrap; }
  .nav { display: flex; gap: 1px; flex-wrap: wrap; }
  .navlink {
    padding: 6px 9px; border-radius: 8px; font-size: 13px; color: var(--text-2);
    text-decoration: none; font-family: inherit; border: 1px solid transparent; background: none; cursor: pointer;
    white-space: nowrap;
  }
  .navlink:hover { background: #f2f3f6; color: var(--text); }
  .navlink.active { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
  .spacer { flex: 1; }
  .btn {
    padding: 7px 14px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
    border-radius: 9px; border: 1px solid var(--border-strong); background: #fff; color: var(--text-2);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .55; cursor: not-allowed; border-color: var(--border-strong); color: var(--text-3); background: #f4f5f7; }
  .btn:disabled:hover { border-color: var(--border-strong); color: var(--text-3); }
  .btn.mini { padding: 4px 10px; font-size: 12px; font-weight: 600; }

  /* ---------- 布局 ---------- */
  .layout { max-width: 1680px; margin: 20px auto; padding: 0 22px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); }

  /* ---------- 筛选区（五行：主条件 / 支付与时间 / 金额与仓配 / 高级筛选 / 已应用条件） ---------- */
  .filters {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 13px 16px; margin-bottom: 16px;
  }
  .frow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .frow + .frow { border-top: 1px dashed var(--border); padding-top: 10px; }
  .frow-lbl { font-size: 12.5px; color: var(--text-3); white-space: nowrap; }
  .filters input[type="search"] {
    flex: 1; min-width: 220px; max-width: 360px; padding: 8px 12px; font-size: 13.5px; font-family: inherit;
    border: 1px solid var(--border-strong); border-radius: 9px; outline: none; background: #fbfbfc;
  }
  .sel, .date, .amt {
    padding: 8px 10px; font-size: 13px; font-family: inherit; max-width: 190px;
    border: 1px solid var(--border-strong); border-radius: 9px; background: #fff; color: var(--text-2); outline: none;
  }
  .date { width: 152px; max-width: none; }
  .amt { width: 92px; max-width: none; font-family: var(--mono); }
  .filters input:focus, .sel:focus, .date:focus, .amt:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .filters .lbl { font-size: 12.5px; color: var(--text-3); white-space: nowrap; }
  .filters .fdivider { width: 1px; height: 20px; background: var(--border); }
  .applied-none { font-size: 12.5px; color: var(--text-3); }
  .check {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2);
    border: 1px solid var(--border-strong); border-radius: 9px; padding: 5px 10px; background: #fff; cursor: pointer;
  }
  .check input { accent-color: var(--accent); }

  /* 高级筛选：默认折叠，展开才出现第二层字段（快照里也只多一行 summary） */
  .adv { border: 1px solid var(--border); border-radius: 10px; background: #fbfbfd; }
  .adv > summary {
    cursor: pointer; padding: 8px 12px; font-size: 12.5px; color: var(--text-2); font-weight: 600;
  }
  .adv > summary:hover { color: var(--accent); }
  .adv[open] > summary { border-bottom: 1px solid var(--border); color: var(--accent); }
  .adv .frow { border-top: 0; padding: 10px 12px 4px; }
  .adv .frow + .frow { border-top: 0; padding-top: 0; }

  .list-panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .list-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 13px 18px; border-bottom: 1px solid var(--border); }
  .list-head h1 { font-size: 16px; margin: 0; }
  .list-head .meta { font-size: 12px; color: var(--text-3); font-family: var(--mono); }

  /* ---------- 二级分组 tab ---------- */
  .tabs {
    display: flex; align-items: center; gap: 2px; padding: 0 12px;
    border-bottom: 1px solid var(--border); background: #fbfbfd; overflow-x: auto;
  }
  .tabs button {
    display: flex; align-items: center; gap: 6px; padding: 11px 12px; font-size: 13.5px; font-family: inherit;
    background: none; border: 0; border-bottom: 2px solid transparent; color: var(--text-3); cursor: pointer; white-space: nowrap;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 650; }
  .tabs .tcount {
    font-size: 11px; font-family: var(--mono); background: #eef0f4; color: var(--text-3);
    border-radius: 100px; padding: 1px 7px;
  }
  .tabs button[aria-selected="true"] .tcount { background: var(--accent-soft); color: var(--accent); }

  /* ---------- 工具条（排序 / 方向 / 每页条数） ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 9px 18px; background: #fdfdfe; border-bottom: 1px solid var(--border);
  }
  .toolbar .lbl { font-size: 12.5px; color: var(--text-3); }

  /* ---------- 订单表格 ---------- */
  .table-wrap { overflow-x: auto; }
  table.orders { width: 100%; min-width: 1620px; border-collapse: collapse; table-layout: fixed; font-size: 12.8px; }
  table.orders th {
    text-align: left; font-size: 12px; font-weight: 600; color: var(--text-3); white-space: nowrap;
    padding: 9px 12px; background: #fafbfd; border-bottom: 1px solid var(--border);
  }
  table.orders th.c-pick { text-align: center; }
  table.orders td {
    padding: 11px 12px; border-bottom: 1px solid var(--border);
    vertical-align: top; color: var(--text-2); line-height: 1.6; word-break: break-word;
  }
  table.orders td.c-pick { text-align: center; }
  table.orders td.c-pick input { accent-color: var(--accent); }
  table.orders tr.order:hover td { background: #fafbfd; }
  table.orders tr.shipped td { background: #f5fcf8; }
  table.orders tr.shipped:hover td { background: #f0faf4; }
  table.orders tr.shipped td:first-child { box-shadow: inset 3px 0 0 var(--green); }
  table.orders.dense td { padding: 5px 12px; }
  table.orders.dense .note, table.orders.dense .masked, table.orders.dense .sub.opt { display: none; }

  /* 行内展开：详情行整行铺开，字段以 dl 网格排布（默认不渲染，点了才插进 DOM） */
  tr.detail-row > td { background: #fbfbfd; border-bottom: 1px solid var(--border); padding: 0; }
  .dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 4px 22px; padding: 14px 18px 16px; }
  .dgrid dl { display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; margin: 0; font-size: 12.5px; }
  .dgrid dt { color: var(--text-3); }
  .dgrid dd { margin: 0; color: var(--text); word-break: break-word; }
  .dgrid dd.mono { font-family: var(--mono); font-size: 12.2px; }
  .dgrid h4 { grid-column: 1 / -1; margin: 8px 0 2px; font-size: 12.5px; color: var(--accent); }
  .dgrid h4:first-child { margin-top: 0; }
  .dnote {
    grid-column: 1 / -1; border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 9px 12px; font-size: 12.6px; line-height: 1.65; background: #fff;
  }
  .dnote b { color: var(--text-3); font-weight: 600; }

  /* ---------- 卡片视图（与表格互斥，默认隐藏） ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 12px; padding: 14px 18px; }
  .cards[hidden] { display: none; }
  .ocard { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; background: #fff; }
  .ocard.shipped { border-color: #cceedf; background: #f7fdfa; }
  .ocard-top { display: flex; align-items: center; gap: 10px; }
  .ocard-top .no { font-family: var(--mono); font-weight: 700; color: var(--accent); font-size: 13px; }
  .ocard-line { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); }
  .ocard-goods { margin: 8px 0 6px; font-size: 13px; font-weight: 650; color: var(--text); }
  .ocard-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px; font-size: 12.4px; color: var(--text-2); }
  .ocard-grid b { color: var(--text); font-weight: 650; }
  .ocard-foot { display: flex; align-items: center; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
  .ocard-foot .ent-ring { width: 38px; height: 38px; }
  .ocard-foot .ent-ring > span { width: 29px; height: 29px; font-size: 10.5px; }

  /* ---------- 单元格里的零件 ---------- */
  .no { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--accent); display: block; }
  button.no {
    background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-family: var(--mono);
    font-size: 12.5px; font-weight: 700; color: var(--accent);
  }
  button.no:hover { text-decoration: underline; }
  .sub { display: block; font-size: 12px; color: var(--text-3); margin-top: 3px; font-family: var(--mono); }
  .sub.plain { font-family: inherit; }
  .buyer { display: block; font-weight: 650; color: var(--text); font-size: 13px; }
  .masked { display: block; font-family: var(--mono); font-size: 12.2px; color: var(--text-3); margin-top: 3px; }
  .goods { display: block; font-weight: 650; color: var(--text); }
  .spec { display: block; font-size: 12px; color: var(--text-3); margin-top: 3px; }
  .addr { display: block; }
  .note { display: block; font-size: 12px; color: var(--text-3); margin-top: 4px; }
  .lv {
    display: inline-block; padding: 1.5px 8px; border-radius: 100px; font-size: 11px; font-weight: 700;
    border: 1px solid transparent; vertical-align: 1px;
  }
  .lv.p { background: #f1f2f5; color: var(--text-2); border-color: #e2e6ee; }
  .lv.s { background: #eef4ff; color: #1d4ed8; border-color: #d8e3fb; }
  .lv.g { background: var(--amber-soft); color: var(--amber); border-color: #fde68a; }
  .lv.d { background: var(--violet-soft); color: var(--violet); border-color: #e9d5ff; }
  .amount { display: block; font-family: var(--mono); font-weight: 700; font-size: 13.5px; color: var(--text); }
  table.orders td.c-qty { text-align: center; font-family: var(--mono); color: var(--text); }
  .st-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
  .badge {
    display: inline-block; padding: 2.5px 9px; border-radius: 100px; font-size: 12px;
    font-weight: 650; white-space: nowrap; border: 1px solid transparent;
  }
  .badge.b-wait { background: var(--amber-soft); color: var(--amber); border-color: #fde68a; }
  .badge.b-toship { background: var(--accent-soft); color: var(--accent); border-color: #dfe3fb; }
  .badge.b-done { background: var(--green-soft); color: var(--green); border-color: #cceedf; }
  .badge.b-signed { background: #eef1f6; color: var(--text-2); border-color: #e2e6ee; }
  .badge.b-cancel { background: var(--red-soft); color: var(--red); border-color: #fbd9d9; }
  .badge.b-after { background: var(--violet-soft); color: var(--violet); border-color: #e9d5ff; }
  .badge::before {
    content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 100px;
    margin-right: 5px; vertical-align: 1px; background: currentColor; opacity: .55;
  }
  /* 出库进度：一条细进度条 + 文字（纯 CSS 宽度，无 DOM 自变） */
  .prog { width: 118px; height: 5px; border-radius: 100px; background: #eef0f4; overflow: hidden; }
  .prog > i { display: block; height: 100%; background: var(--accent); }
  .prog.good > i { background: var(--green); }
  .prog-meta { font-size: 11.5px; color: var(--text-3); font-family: var(--mono); }
  .btn.ship { padding: 5px 13px; font-size: 12.5px; }
  /* 操作列钉在右侧：演示窗口只有 ~1036px 宽，表格必然横向滚动，
   * 钉住「发货」这一列才能让目标按钮始终在视口里（企业后台的常规做法）。 */
  table.orders th.c-ops, table.orders td.c-ops {
    position: sticky; right: 0; background: #fff;
    box-shadow: -8px 0 10px -8px rgba(16, 18, 24, .18);
  }
  table.orders th.c-ops { background: #fafbfd; }
  table.orders tr.order:hover td.c-ops { background: #fafbfd; }
  table.orders tr.shipped td.c-ops { background: #f5fcf8; }
  table.orders tr.shipped:hover td.c-ops { background: #f0faf4; }
  .ops { display: flex; gap: 5px; flex-wrap: wrap; }
  .empty { padding: 56px 20px; text-align: center; color: var(--text-3); font-size: 13px; }
  .panel-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 12px 18px; border-top: 1px solid var(--border);
  }
  .pager { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pager .meta { font-size: 12.5px; color: var(--text-3); font-family: var(--mono); margin-left: 6px; }
  .pager .pg {
    min-width: 30px; padding: 4px 8px; font-size: 12.5px; font-family: var(--mono); cursor: pointer;
    border: 1px solid var(--border-strong); border-radius: 8px; background: #fff; color: var(--text-2);
  }
  .pager .pg[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .shiplog { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .shiplog .meta { font-size: 12.5px; color: var(--text-3); }
  .shiplog b { color: var(--green); font-family: var(--mono); }
  .foot { text-align: center; color: var(--text-3); font-size: 12px; padding: 4px 20px 30px; }

  /* ---------- 抽屉里的块 ---------- */
  .pay-list { list-style: none; margin: 0; padding: 0; }
  .pay-list li {
    display: flex; align-items: center; gap: 10px; padding: 9px 11px; font-size: 12.5px;
    border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px;
  }
  .pay-list .pay-amt { margin-left: auto; font-family: var(--mono); font-weight: 700; color: var(--text); }
  .pay-list .pay-amt.good { color: var(--green); }
  .pay-list .pay-amt.warn { color: var(--amber); }
  .pay-list .pay-meta { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
  .note-box {
    border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 10px;
    padding: 10px 12px; font-size: 12.8px; color: var(--text-2); line-height: 1.7; margin-bottom: 10px;
  }
  .note-box.warn { border-left-color: #f59e0b; }
  .sent-line { font-size: 11.5px; color: var(--text-3); font-family: var(--mono); margin: 0 0 6px; }

  .ent-drawer-head { flex-wrap: wrap; }
  .ent-drawer-head h2 { word-break: break-all; }
  .ent-drawer-head .ent-btn-mini { flex: none; }

  .toast {
    position: fixed; bottom: calc(var(--ent-status-h) + 22px); left: 50%; transform: translateX(-50%) translateY(14px);
    background: #17181c; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: .22s; z-index: 99; max-width: 88vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  @media (max-width: 820px) {
    .layout { padding: 0 12px; }
    .filters input[type="search"] { max-width: none; }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="topbar">
  <span class="brand">◇ 云上书城订单中台</span>
  <nav class="nav" aria-label="主导航">
    <a class="navlink" href="#" data-page="首页">首页</a>
    <a class="navlink active" href="#" data-page="订单中心" aria-current="page">订单中心</a>
    <a class="navlink" href="#" data-page="商品管理">商品管理</a>
    <a class="navlink" href="#" data-page="客服工作台">客服工作台</a>
    <a class="navlink" href="#" data-page="数据报表">数据报表</a>
  </nav>
  <button class="btn" id="resetBtn" type="button">重置演示</button>
  <span class="spacer"></span>
</header>

<!-- KPI 条 + 系统公告（由 Enterprise.mountShell 填充） -->
<div class="ent-kpis" id="entKpis"></div>
<div id="entTickerHost"></div>

<div class="layout">

  <section class="filters" aria-label="订单筛选">
    <!-- ① 关键词与主条件下拉 -->
    <div class="frow">
      <input id="kw" type="search" aria-label="搜索订单号 / 买家 / 手机号 / 商品关键字"
             placeholder="搜索订单号 / 买家 / 手机号 / 商品关键字" />
      <select id="scopeSel" class="sel" aria-label="搜索范围"></select>
      <select id="statusSel" class="sel" aria-label="订单状态"></select>
      <select id="levelSel" class="sel" aria-label="买家等级"></select>
      <select id="channelSel" class="sel" aria-label="销售渠道"></select>
      <span class="fdivider" aria-hidden="true"></span>
      <button class="btn primary" id="queryBtn" type="button">查询</button>
      <button class="btn" id="filterResetBtn" type="button">重置</button>
      <span class="lbl" id="filterHint"></span>
    </div>

    <!-- ② 支付方式（多选 chips）+ 下单时间（区间 + 快捷档） -->
    <div class="frow">
      <span class="frow-lbl">支付方式</span>
      <div class="ent-chips" id="payChips" aria-label="支付方式多选"></div>
      <span class="fdivider" aria-hidden="true"></span>
      <span class="frow-lbl">下单时间</span>
      <input id="fromDate" class="date" type="text" aria-label="开始日期" placeholder="开始日期 2026-09-20" />
      <span class="lbl">至</span>
      <input id="toDate" class="date" type="text" aria-label="结束日期" placeholder="结束日期 2026-09-23" />
      <div class="ent-chips" id="rangeChips" aria-label="下单时间快捷筛选"></div>
    </div>

    <!-- ③ 实付金额（区间 + 快捷档）+ 仓配 -->
    <div class="frow">
      <span class="frow-lbl">实付金额</span>
      <!-- 名字刻意不叫「实付金额下限」：`spinbutton "实付金额下限"` 里含子串
           `button "实付金额`，会把按 label 找「实付金额」列的正则抢走 -->
      <input id="amtMin" class="amt" type="number" min="0" step="1" aria-label="金额下限" placeholder="下限" />
      <span class="lbl">至</span>
      <input id="amtMax" class="amt" type="number" min="0" step="1" aria-label="金额上限" placeholder="上限" />

function shiftTs(ts, hours) {
  const day = ts.slice(0, 10), hm = ts.slice(11);
  let h = parseInt(hm.slice(0, 2), 10) + hours;
  let d = parseInt(day.slice(8, 10), 10);
  while (h >= 24) { h -= 24; d += 1; }
  return day.slice(0, 8) + String(d).padStart(2, '0') + ' ' + String(h).padStart(2, '0') + hm.slice(2);
}

/* 搜索范围：只在选中的字段里做子串匹配（默认「全部字段」= 与简单版逐条等价） */
function scopeHit(o, q) {
  const pick = {
    '全部字段': o.no + ' ' + o.buyer + ' ' + o.phone + ' ' + o.goods + ' ' + o.address + ' ' + o.waybill + ' ' + o.receiver + ' ' + o.sku,
    '订单号': o.no,
    '买家昵称': o.buyer,
    '收件手机号': o.phone,
    '商品名称': o.goods,
    '收货地址': o.address,
    '运单号': o.waybill
  };
  return String(pick[state.scope] === undefined ? pick['全部字段'] : pick[state.scope]).toLowerCase().indexOf(q) !== -1;
}

/* 发货后的那一行不再受状态筛选影响，保证状态变化始终可见。
 * 新增的筛选一律「空值 = 不生效」，默认态与改造前逐条等价。 */
function visible() {
  const q = state.query.trim().toLowerCase();
  return state.orders.filter((o) => {
    if (state.status !== '全部状态' && !o.shipped && o.status !== state.status) return false;
    if (state.level !== '全部等级' && o.level !== state.level) return false;
    if (state.channel !== '全部渠道' && o.channel !== state.channel) return false;
    if (state.pays.length && state.pays.indexOf(o.pay) === -1) return false;
    if (state.from && o.ts.slice(0, 10) < state.from) return false;
    if (state.to && o.ts.slice(0, 10) > state.to) return false;
    if (state.amountMin !== '' && o.amount < Number(state.amountMin)) return false;
    if (state.amountMax !== '' && o.amount > Number(state.amountMax)) return false;
    if (state.warehouse !== '全部仓库' && o.warehouse !== state.warehouse) return false;
    if (state.carrier !== '全部承运商' && o.carrier !== state.carrier) return false;
    if (state.invoice !== '全部发票类型' && o.invoice !== state.invoice) return false;
    if (state.risk !== '全部风控状态' && o.risk !== state.risk) return false;
    if (state.after !== '全部售后状态' && o.after !== state.after) return false;
    if (state.service !== '全部跟进状态' && o.service !== state.service) return false;
    if (state.eta !== '全部时效' && ((o.late && !o.shipped) ? '已超时' : '正常') !== state.eta) return false;
    if (state.urgentOnly && !o.urgent) return false;
    if (state.giftOnly && o.gift === '无') return false;
    if (state.lateOnly && !(o.late && !o.shipped)) return false;
    if (state.vipOnly && !(o.level === '金卡' || o.level === '钻石')) return false;
    if (state.tab === 'pay' && o.status !== '待付款') return false;
    if (state.tab === 'ship' && o.status !== '已付款待发货') return false;
    if (state.tab === 'after' && o.status !== '售后处理中') return false;
    if (state.tab === 'risk' && !(o.late && !o.shipped)) return false;
    if (state.tab === 'urgent' && !o.urgent) return false;
    if (q && !scopeHit(o, q)) return false;
    return true;
  });
}

/* 默认排序（下单时间倒序）**原样返回原数组**，绝不走 sort —— 保证默认行序逐字节不变 */
function sortedList(list) {
  if (state.sortKey === 'ts' && state.sortDir === 'desc') return list;
  const copy = list.slice();
  copy.sort((a, b) => {
    let r;
    if (state.sortKey === 'amount') r = a.amount - b.amount;
    else if (state.sortKey === 'qty') r = a.qty - b.qty;
    else if (state.sortKey === 'level') r = (LEVEL_RANK[a.level] || 0) - (LEVEL_RANK[b.level] || 0);
    else r = (a.ts < b.ts ? -1 : (a.ts > b.ts ? 1 : 0));
    return state.sortDir === 'asc' ? r : -r;
  });
  return copy;
}

/* ---------- 分页（默认每页 20 条 ≥ 18 笔，所以首屏一直是「全部 18 笔都在第 1 页」） ---------- */
function pageCount() {
  const n = Math.max(1, Math.ceil(sortedList(visible()).length / state.pageSize));
  return n;
}
function pageList() {
  const list = sortedList(visible());
  const start = (state.page - 1) * state.pageSize;
  return list.slice(start, start + state.pageSize);
}

/* ---------- 勾选 / 批量操作条 ---------- */
function isPicked(no) { return state.picked.indexOf(no) !== -1; }

/* 批量操作条：只在有勾选时**才创建**，绝不常驻。 */
function renderBulk() {
  const host = $('bulkHost');
  host.innerHTML = '';
  const n = state.picked.length;
  if (!n) return;
  const bar = el('div', 'ent-bulkbar');
  const lab = el('span');
  lab.appendChild(document.createTextNode('已选中 '));
  lab.appendChild(el('b', 'ent-bulk-n', String(n)));
  lab.appendChild(document.createTextNode(' 笔订单'));
  bar.appendChild(lab);
  const amt = state.orders.filter((o) => isPicked(o.no)).reduce((s, o) => s + o.amount, 0);
  bar.appendChild(el('span', 'meta', '合计 ' + money(amt)));
  bar.appendChild(el('span', 'spacer'));
  const mk = (label, fn) => {
    const b = el('button', 'btn mini', label);
    b.type = 'button';
    b.onclick = fn;
    return b;
  };
  bar.appendChild(mk('批量发货', () => {
    const nos = state.picked.slice();
    const cur = state.orders.filter((o) => nos.indexOf(o.no) !== -1 && !o.shipped && o.status !== '待付款' && o.status !== '已取消' && o.status !== '已签收');
    if (!cur.length) { toast('演示：选中的订单当前都不可发货'); return; }
    cur.forEach((o) => shipOrder(o.no, true));
    state.picked = [];
    render();
    toast('已批量发货 ' + cur.length + ' 笔订单');
  }));
  bar.appendChild(mk('批量打印面单', () => toast('演示：不会真的打印 ' + n + ' 张面单')));
  bar.appendChild(mk('批量导出', () => toast('演示：不会真的导出文件')));
  bar.appendChild(mk('取消选择', () => { state.picked = []; render(); }));
  host.appendChild(bar);
}

/* ---------- 订单详情抽屉 ---------- */
function traceSteps(o) { return TRACE_STEPS[o.status] || TRACE_STEPS['已付款待发货']; }
function traceNow(o) {
  const t = TRACE[o.no] || (TRACE[o.no] = { advance: 0 });
  const last = traceSteps(o).length - 1;
  const base = TRACE_NOW[o.status] === undefined ? 0 : TRACE_NOW[o.status];
  return Math.min(base + t.advance, last);
}
function traceBody(o, step, i) {
  switch (step) {
    case '买家提交订单': return '订单由「' + o.buyer + '」通过' + o.channel + '提交，支付方式 ' + o.pay + '，件数 ×' + o.qty + '。';
    case '等待买家付款': return '等待买家完成支付，超过 24 小时未付款将自动关闭订单。';
    case '超时未付款自动关闭': return '已超时未付款，系统将在下一个批处理周期关闭订单并释放库存。';
    case '支付成功': return '实付 ' + money(o.amount) + '，交易号 ' + o.trade + '。';
    case '仓库接单待拣货': return o.warehouse + ' 已接单，等待当日波次拣货，预计 ' + shiftTs(o.ts, 6 + i) + ' 出库。';
    case '打包出库': return '商品质检与打包已完成，出库复核通过，等待交接 ' + o.carrier + '。';
    case '承运商揽收': return o.carrier + ' 已揽收，运单号 ' + o.waybill + '，包裹进入干线运输。';
    case '运输中': return '包裹在途，预计 ' + o.eta + ' 前送达收件城市。';
    case '已签收': return '包裹已签收，签收人 ' + o.buyer + '（演示数据）。';
    case '买家申请取消': return '买家发起取消申请，订单转入售后流程，仓库已停止拣货。';
    case '订单已关闭': return '订单已关闭，款项原路退回，预计 1 至 3 个工作日到账。';
    case '买家申请售后': return '买家发起售后申请（' + o.after + '），出库已冻结，等待质检结论。';
    case '售后审核中': return '售后单已进入审核队列，审核通过后按' + o.after + '流程处理。';
    default: return '';
  }
}
function traceTimeline(o) {
  const steps = traceSteps(o);
  const now = traceNow(o);
  const ul = el('ul', 'ent-timeline');
  steps.forEach((s, i) => {
    let cls = i < now ? 'done' : (i === now ? 'now' : '');
    if (o.status === '已取消' && s === '买家申请取消') cls = i <= now ? 'warn' : '';
    if (o.status === '售后处理中' && s === '买家申请售后') cls = i <= now ? 'warn' : '';
    if (now === steps.length - 1 && i === now) cls = 'done';
    const li = el('li', cls);
    li.appendChild(el('span', 'ent-tl-title', s));
    li.appendChild(el('span', 'ent-tl-meta', shiftTs(o.ts, i * 7) + ' · 处理节点 ' + (i + 1) + ' / ' + steps.length));
    /* 还没走到的节点只留标题与时间，不写正文 —— 免得把「未来」当既成事实陈述 */
    li.appendChild(el('span', 'ent-tl-body', i > now ? '该节点尚未到达' : traceBody(o, s, i)));
    ul.appendChild(li);
  });
  return ul;
}

function openDetail(no) {
  const o = state.orders.find((x) => x.no === no);
  if (!o) return;
  const renders = [
    () => detailOverview(o),
    () => detailPay(o),
    () => detailTrace(o),
    () => detailOps(o),
    () => detailNotes(o)
  ];

  const foot = document.createDocumentFragment();
  const upd = el('button', 'btn', '模拟物流更新');
  upd.type = 'button';
  const syncUpd = () => {
    const end = traceNow(o) >= traceSteps(o).length - 1;
    upd.textContent = end ? '物流已完结' : '模拟物流更新';
    upd.disabled = end;
  };
  syncUpd();
  upd.onclick = () => {
    if (!TRACE[o.no]) TRACE[o.no] = { advance: 0 };
    TRACE[o.no].advance += 1;
    refresh();
    toast('演示：已推进一步物流轨迹（' + o.no + '）');
  };
  foot.appendChild(upd);
  const prt = el('button', 'btn', '打印面单');
  prt.type = 'button';
  prt.onclick = () => toast('演示：不会真的打印面单（' + o.no + '）');
  foot.appendChild(prt);
  const cp = el('button', 'btn', '复制订单号');
  cp.type = 'button';
  cp.onclick = () => toast('演示：订单号 ' + o.no + ' 已展示在标题栏');
  foot.appendChild(cp);

  /* 轨迹推进后只重画「当前选中的那个 tab」，不整抽屉重开 */
  function refresh() {
    const tabsEl = document.querySelector('.ent-drawer-tabs');
    const body = document.querySelector('.ent-drawer-body');
    if (!tabsEl || !body) return;
    let idx = 0;
    Array.prototype.forEach.call(tabsEl.children, (b, i) => {
      if (b.getAttribute('aria-selected') === 'true') idx = i;
    });
    Enterprise.clear(body);
    body.appendChild(renders[idx]());
    syncUpd();
  }

  Enterprise.drawer.open({
    title: o.no,
    sub: o.buyer + ' · ' + o.level + '会员 · ' + o.status,
    tabs: [
      { label: '订单概览', render: renders[0] },
      { label: '支付与对账', render: renders[1] },
      { label: '物流轨迹', render: renders[2] },
      { label: '操作日志', render: renders[3] },
      { label: '备注与客服', render: renders[4] }
    ],
    footer: foot
  });
}

  prt.setAttribute('aria-label', '打印面单 ' + o.no);
  prt.onclick = () => toast('演示：不会真的打印面单（' + o.no + '）');
  ops.appendChild(prt);
  const dtl = el('button', 'btn mini', '订单详情');
  dtl.type = 'button';
  dtl.setAttribute('aria-label', '查看订单详情 ' + o.no);
  dtl.onclick = () => openDetail(o.no);
  ops.appendChild(dtl);
  const exp = el('button', 'btn mini', isExpanded(o.no) ? '收起' : '展开');
  exp.type = 'button';
  exp.setAttribute('aria-label', (isExpanded(o.no) ? '收起' : '展开') + ' ' + o.no);
  exp.onclick = () => {
    state.expanded = isExpanded(o.no) ? state.expanded.filter((x) => x !== o.no) : state.expanded.concat([o.no]);
    render();
  };
  ops.appendChild(exp);
  td8.appendChild(ops);
  tr.appendChild(td8);

  return tr;
}

function buildCard(o) {
  const c = el('article', 'ocard' + (o.shipped ? ' shipped' : '') + (o.fresh ? ' ent-flash' : ''));
  c.setAttribute('aria-label', '订单卡片 ' + o.no);

  const top = el('div', 'ocard-top');
  const noBtn = el('button', 'no', o.no);
  noBtn.type = 'button';
  noBtn.setAttribute('aria-label', o.no);
  noBtn.onclick = () => openDetail(o.no);
  top.appendChild(noBtn);
  top.appendChild(el('span', 'badge ' + (BADGE[o.status] || ''), o.status));
  if (o.urgent) top.appendChild(el('span', 'ent-tag bad', '加急'));
  top.appendChild(el('span', 'spacer'));
  top.appendChild(progressBar(o));
  c.appendChild(top);

  const l1 = el('div', 'ocard-line');
  l1.appendChild(el('span', null, o.buyer));
  l1.appendChild(levelTag(o));
  l1.appendChild(el('span', null, '手机 ' + o.phone));
  l1.appendChild(el('span', null, o.channel));
  c.appendChild(l1);
  c.appendChild(el('div', 'ocard-goods', o.goods));

  const grid = el('div', 'ocard-grid');
  const pair = (k, v) => {
    const d = el('div');
    d.appendChild(document.createTextNode(k + ' '));
    d.appendChild(el('b', null, v));
    grid.appendChild(d);
  };
  pair('SKU', o.sku);
  pair('规格', o.spec);
  pair('实付', money(o.amount));
  pair('单价 × 件数', money(o.unit) + ' ×' + o.qty);
  pair('仓库', o.warehouse);
  pair('承运商', o.carrier);
  pair('运单', o.waybill);
  pair('预计送达', o.eta);
  pair('发票', o.invoice);
  pair('风控 / 售后', o.risk + ' / ' + o.after);
  pair('客服', o.service);
  pair('赠品', o.gift);
  c.appendChild(grid);

  const foot = el('div', 'ocard-foot');
  foot.appendChild(primaryBtn(o));
  const dtl = el('button', 'btn mini', '订单详情');
  dtl.type = 'button';
  dtl.setAttribute('aria-label', '查看订单详情 ' + o.no);
  dtl.onclick = () => openDetail(o.no);
  foot.appendChild(dtl);
  if (o.tags.length) o.tags.forEach((t) => foot.appendChild(el('span', 'ent-tag' + (t === '催单' ? ' warn' : ''), t)));
  c.appendChild(foot);
  return c;
}

function tabCount(id) {
  const s = state.orders;
  if (id === 'pay') return s.filter((o) => o.status === '待付款').length;
  if (id === 'ship') return s.filter((o) => o.status === '已付款待发货').length;
  if (id === 'after') return s.filter((o) => o.status === '售后处理中').length;
  if (id === 'risk') return s.filter((o) => o.late && !o.shipped).length;
  if (id === 'urgent') return s.filter((o) => o.urgent).length;
  return s.length;
}

function renderTabs() {
  const host = $('tabBar');
  host.innerHTML = '';
  TABS.forEach((t) => {
    const b = el('button');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', state.tab === t.id ? 'true' : 'false');
    b.appendChild(el('span', null, t.label));
    b.appendChild(el('span', 'tcount', String(tabCount(t.id))));
    b.onclick = () => {
      state.tab = t.id;
      state.picked = [];
      state.page = 1;
      render();
      toast('已切换到「' + t.label + '」分组');
    };
    host.appendChild(b);
  });
}

function renderApplied() {
  const host = $('appliedHost');
  host.innerHTML = '';
  const conds = conditions();
  if (!conds.length) {
    host.appendChild(el('span', 'applied-none', '无筛选条件'));
    return;
  }
  conds.forEach((c) => {
    const b = el('button', 'ent-chip on', c.label);
    b.type = 'button';
    b.setAttribute('aria-label', '移除条件 ' + c.label);
    b.appendChild(el('span', 'ent-chip-x', '×'));
    b.onclick = () => {
      c.clear();
      state.page = 1;
      render();
      toast('已移除筛选条件 ' + c.label);
    };
    host.appendChild(b);
  });
}

function renderPager(total) {
  const pages = pageCount();
  $('firstPage').disabled = state.page <= 1;
  $('prevPage').disabled = state.page <= 1;
  $('nextPage').disabled = state.page >= pages;
  $('lastPage').disabled = state.page >= pages;
  const nums = $('pageNums');
  nums.innerHTML = '';
  for (let i = 1; i <= pages; i++) {
    const b = el('button', 'pg', String(i));
    b.type = 'button';
    b.setAttribute('aria-label', '第 ' + i + ' 页');
    if (i === state.page) b.setAttribute('aria-current', 'page');
    b.onclick = () => { state.page = i; render(); };
    nums.appendChild(b);
  }
  const from = total ? (state.page - 1) * state.pageSize + 1 : 0;
  const to = Math.min(state.page * state.pageSize, total);
  $('pageMeta').textContent = '第 ' + state.page + ' / ' + pages + ' 页 · 当前显示 ' + from + ' 至 ' + to +
    ' 条 · 筛选后共 ' + total + ' 笔';
}

function render() {
  const list = sortedList(visible());
  /* 先把页码夹回合法范围，再取当页 —— 否则筛掉一批后可能停在一张不存在的页上 */
  const pages = Math.max(1, Math.ceil(list.length / state.pageSize));
  if (state.page > pages) state.page = pages;
  if (state.page < 1) state.page = 1;
  const pageRows = pageList();

  const body = $('orderBody');
  body.innerHTML = '';
  pageRows.forEach((o) => {
    body.appendChild(buildRow(o));
    if (isExpanded(o.no)) body.appendChild(expandRow(o));
  });

  const cardHost = $('cardHost');
  cardHost.innerHTML = '';
  pageRows.forEach((o) => cardHost.appendChild(buildCard(o)));

  $('emptyState').hidden = list.length > 0;
  $('tableWrap').hidden = state.view !== 'table' || list.length === 0;
  cardHost.hidden = state.view !== 'card' || list.length === 0;

  const shipped = state.orders.filter((o) => o.shipped).length;
  const kept = (state.status !== '全部状态') ? list.filter((o) => o.shipped).length : 0;
  $('listMeta').textContent = '共 ' + list.length + ' 笔'
    + (kept ? '（含本轮已发货 ' + kept + ' 笔，便于核对）' : '')
    + ' · 待出库 ' + state.orders.filter((o) => o.status === '已付款待发货').length + ' 笔'
    + ' · 加急 ' + state.orders.filter((o) => o.urgent).length + ' 笔'
    + ' · 超时未发货 ' + state.orders.filter((o) => o.late && !o.shipped).length + ' 笔'
    + ' · 大额 ' + state.orders.filter((o) => o.amount >= BIG_AMOUNT).length + ' 笔';

  $('filterHint').textContent = filtersActive() ? '已启用筛选条件' : '未使用任何筛选';

  $('shipCount').textContent = String(shipped);
  $('shipLog').textContent = state.log.length ? '发货记录：' + state.log.join('、') : '暂无发货记录';

  $('toolbarMeta').textContent = '排序字段 ' + sortLabel() + ' · ' + (state.sortDir === 'desc' ? '降序' : '升序') +
    ' · 每页 ' + state.pageSize + ' 条';

  renderTabs();
  renderBulk();
  renderApplied();
  renderPager(list.length);

  /* chips / 开关 / 视图的选中态：由 state 推出，不另存 */
  Array.prototype.forEach.call($('payChips').children, (b) => {
    b.classList.toggle('on', state.pays.indexOf(b.dataset.pay) !== -1);
  });
  Array.prototype.forEach.call($('rangeChips').children, (b) => {
    b.classList.toggle('on', b.dataset.range === state.rangeChip);
  });
  Array.prototype.forEach.call($('amtChips').children, (b) => {
    b.classList.toggle('on', b.dataset.amt === state.amountChip);
  });
  Array.prototype.forEach.call($('viewChips').children, (b) => {
    b.classList.toggle('on', viewActive(b.dataset.view));
  });

  const sel = pageRows.filter((o) => isPicked(o.no)).length;
  $('pickAll').checked = pageRows.length > 0 && sel === pageRows.length;
  $('pickAll').indeterminate = sel > 0 && sel < pageRows.length;
  $('pickAll').disabled = pageRows.length === 0;
}

function sortLabel() {
  const hit = SORTS.find((s) => s[0] === state.sortKey);
  return hit ? hit[1] : '下单时间';
}

/* ---------- 发货 ---------- */
function shipOrder(no, silent) {
  const cur = state.orders.find((o) => o.no === no);
  if (!cur || cur.shipped) return;
  state.orders = state.orders.map((o) => (o.no === no ? Object.assign({}, o, { shipped: true, status: '已发货' }) : o));
  state.log = state.log.concat(no);
  render();
  Enterprise.bumpKpi($('entKpis'), '待发货', -1);
  if (!silent) toast('已发货：订单 ' + no + '（' + cur.buyer + ' · ' + cur.goods.slice(0, 16) + '…）');
}

/* ---------- 顶部与筛选交互 ---------- */
Array.prototype.forEach.call(document.querySelectorAll('.navlink'), (a) => {
  a.addEventListener('click', (e) => {
    e.preventDefault();
    toast('演示页：当前仅「订单中心」有数据，其它菜单不可用');
  });
});

/* 任何筛选变化都回到第 1 页 —— 否则会停在一张已经不存在的页码上 */
function onFilterChange() { state.page = 1; render(); }

$('kw').addEventListener('input', (e) => { state.query = e.target.value; onFilterChange(); });
$('kw').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); onFilterChange(); toast('已按关键词查询：共 ' + visible().length + ' 笔'); }
});
$('scopeSel').addEventListener('change', (e) => { state.scope = e.target.value; onFilterChange(); });
$('statusSel').addEventListener('change', (e) => { state.status = e.target.value; onFilterChange(); });
$('levelSel').addEventListener('change', (e) => { state.level = e.target.value; onFilterChange(); });
$('channelSel').addEventListener('change', (e) => { state.channel = e.target.value; onFilterChange(); });
$('fromDate').addEventListener('change', (e) => { state.from = e.target.value.trim(); state.rangeChip = 'all'; onFilterChange(); });
$('toDate').addEventListener('change', (e) => { state.to = e.target.value.trim(); state.rangeChip = 'all'; onFilterChange(); });
$('amtMin').addEventListener('change', (e) => { state.amountMin = e.target.value.trim(); state.amountChip = 'all'; onFilterChange(); });
$('amtMax').addEventListener('change', (e) => { state.amountMax = e.target.value.trim(); state.amountChip = 'all'; onFilterChange(); });
$('warehouseSel').addEventListener('change', (e) => { state.warehouse = e.target.value; onFilterChange(); });
$('carrierSel').addEventListener('change', (e) => { state.carrier = e.target.value; onFilterChange(); });
$('invoiceSel').addEventListener('change', (e) => { state.invoice = e.target.value; onFilterChange(); });
$('riskSel').addEventListener('change', (e) => { state.risk = e.target.value; onFilterChange(); });
$('afterSel').addEventListener('change', (e) => { state.after = e.target.value; onFilterChange(); });
$('serviceSel').addEventListener('change', (e) => { state.service = e.target.value; onFilterChange(); });
$('etaSel').addEventListener('change', (e) => { state.eta = e.target.value; onFilterChange(); });
$('urgentOnly').addEventListener('change', (e) => { state.urgentOnly = e.target.checked; onFilterChange(); });
$('giftOnly').addEventListener('change', (e) => { state.giftOnly = e.target.checked; onFilterChange(); });
$('lateOnly').addEventListener('change', (e) => { state.lateOnly = e.target.checked; onFilterChange(); });
$('vipOnly').addEventListener('change', (e) => { state.vipOnly = e.target.checked; onFilterChange(); });

$('queryBtn').onclick = () => {
  state.query = $('kw').value;
  state.from = $('fromDate').value.trim();
  state.to = $('toDate').value.trim();
  state.amountMin = $('amtMin').value.trim();
  state.amountMax = $('amtMax').value.trim();
  state.page = 1;
  render();
  toast('查询完成：当前条件下共 ' + visible().length + ' 笔订单');
};

$('filterResetBtn').onclick = () => {
  clearFilters();
  render();
  toast('已重置筛选条件，恢复全部 18 笔订单');
};

$('resetBtn').onclick = () => {
  hardReset();
  toast('演示已重置为初始 18 笔订单');
};

$('sortSel').addEventListener('change', (e) => {
  const hit = SORTS.find((s) => s[1] === e.target.value);
  state.sortKey = hit ? hit[0] : 'ts';
  state.page = 1;
  render();
  toast('已按「' + e.target.value + '」' + (state.sortDir === 'desc' ? '降序' : '升序') + '排列');
});
$('dirBtn').onclick = () => {
  state.sortDir = state.sortDir === 'desc' ? 'asc' : 'desc';
  $('dirBtn').textContent = state.sortDir === 'desc' ? '降序 ↓' : '升序 ↑';
  state.page = 1;
  render();
  toast('已切换为' + (state.sortDir === 'desc' ? '降序' : '升序'));
};
$('pageSizeSel').addEventListener('change', (e) => {
  state.pageSize = parseInt(e.target.value, 10) || 20;
  state.page = 1;
  render();
});

/* 密度切换：只切 class，不改任何文本以外的结构 */
$('densityBtn').onclick = () => {
  const dense = document.querySelector('table.orders').classList.toggle('dense');
  state.density = dense ? 'compact' : 'cozy';
  $('densityBtn').textContent = '密度 ' + (dense ? '紧凑' : '舒适');
  toast(dense ? '已切换为紧凑密度' : '已切换为舒适密度');
};

/* 卡片 / 表格视图切换：只切 hidden，不重建 DOM 文本 */
$('cardViewBtn').onclick = () => {
  state.view = state.view === 'card' ? 'table' : 'card';
  $('cardViewBtn').textContent = state.view === 'card' ? '表格视图' : '卡片视图';
  render();
  toast(state.view === 'card' ? '已切换到卡片视图' : '已切换到表格视图');
};

$('exportBtn').onclick = () => toast('演示：不会真的导出文件（当前 ' + visible().length + ' 笔）');

/* 刷新走骨架屏：这是**用户触发**的动作，不会自己发生，因此不影响快照确定性 */
$('refreshBtn').onclick = () => {
  const wrap = $('tableWrap');
  wrap.hidden = true;
  Enterprise.skeleton($('tableHost'), 420, () => {
    render();
    toast('已同步订单数据（最近同步 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }) + '）');
  });
};

$('pickAll').addEventListener('change', (e) => {
  const rows = pageList();
  state.picked = e.target.checked ? rows.map((o) => o.no) : [];
  render();
});

$('firstPage').onclick = () => { state.page = 1; render(); };
$('prevPage').onclick = () => { state.page = Math.max(1, state.page - 1); render(); };
$('nextPage').onclick = () => { state.page = Math.min(pageCount(), state.page + 1); render(); };
$('lastPage').onclick = () => { state.page = pageCount(); render(); };

/* 便于脚本化核对：window.__ordersComplex.shipped / .log / .orders */
window.__ordersComplex = {
  get shipped() { return state.orders.filter((o) => o.shipped).map((o) => o.no); },
  get log() { return state.log.slice(); },
  get orders() { return state.orders.map((o) => ({ no: o.no, goods: o.goods, status: o.status, buyer: o.buyer, level: o.level })); }
};

      { sep: true },
      { id: 'report', icon: '📊', label: '报表' }
    ],
    onPick: (m) => {

  notices: [

    { icon: '🧾', title: '大额订单待二次复核', body: 'ORD-20260923-5222 实付超过 2000 元，已触发人工复核流程。', time: '09-24 07:55', unread: true },
    { icon: '🚚', title: '承运商面单额度不足', body: '中通快递电子面单剩余 1,240 张，低于 3 日用量，请及时充值。', time: '09-23 19:10', unread: true },

  ],

    items: [
      { icon: '👤', label: '个人资料', onPick: () => toast('演示：个人资料页未实现') },

  },

  },
  statusbar: {
    left: [{ dot: true, text: '订单服务正常' }, { text: '在线坐席 8 位' }, { text: '待处理工单 12 单' }],

  },
  searchSelector: '#kw',
  onReady: ({ sim }) => {
    /* 实时模拟：逐笔进入新订单。这是**唯一**会自己改页面的机制，且必须由用户显式打开。
     * 单号、买家、金额全在固定脚本里，不随机 —— 演示要可复述、可核对。 */
    sim.subscribe((step) => {
      if (step > INCOMING.length) {
        Enterprise.toast({ icon: '✔', title: '模拟已跑完固定脚本', meta: '共进入 ' + INCOMING.length + ' 笔新订单' });
        return;
      }
      /* 新的一笔到达时把上一笔的高亮摘掉 —— 用状态做，不另起定时器 */
      state.orders = state.orders.map((o) => (o.fresh ? Object.assign({}, o, { fresh: false }) : o));
      const src = INCOMING[step - 1];
      const o = Object.assign({
        id: 100 + step, idx: step, shipped: false, fresh: true,
        trade: '42009' + String(18307461205 + (step + 40) * 13337),
        waybill: 'SF' + String(880100 + step * 17),
        eta: shiftTs(src.ts, 32).slice(0, 10),
        amount: round2(src.qty * src.unit - src.discount),
        warehouse: WAREHOUSES[1 + (step % 5)], carrier: CARRIERS[1 + (step % 5)],
        late: false
      }, src);
      state.orders = [o].concat(state.orders);
      state.arrivals = step;
      render();
      Enterprise.bumpKpi($('entKpis'), '今日订单', 1);
      Enterprise.toast({ icon: '🧾', title: '新订单 · ' + o.buyer, meta: o.no + ' · ' + money(o.amount) + ' · ' + o.status });
    });
  }
});

reset();
